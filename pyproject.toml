[project]
name = "conversation2sql"
version = "0.1.0"
authors = [
    { name = "Simone Papicchio", email = "simone.papicchio@polito.it" },
]
description = "TODO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "jinja2>=3.1",
    "litellm>=1.0",
    "inspect-ai>=0.3",
    "loguru>=0.7.3",
    "datasets>=4.6.1",
    "hf-transfer>=0.1.9",
    "langchain>=1.2.10",
    "pyyaml>=6.0",
    "pyrefly>=0.55.0",
    "langchain-openai>=1.1.11",
    "langchain-litellm>=0.6.1",
    "pydantic>=2.12.5",
    "langchain-community>=0.4.1",
    "langgraph>=1.0.10",
    "dotenv>=0.9.9",
    "langsmith>=0.7.14",
    "frozendict>=2.4.7",
    "psycopg2-binary>=2.9.11",
    "ipykernel>=7.2.0",
    "fastapi>=0.135.3",
    # ── framework: MCP-based evaluation services ─────────────────────────────
    "mcp>=1.5", # Official MCP SDK (FastMCP + transports)
    "langchain-mcp-adapters>=0.2", # MCP client for LangGraph ReAct agent
    "uvicorn>=0.30", # ASGI server for FastAPI + FastMCP services
    "httpx>=0.27", # Async HTTP client for orchestrator
    "pydantic-settings>=2.0", # BaseSettings for env-driven config
    "sqlglot>=25.0", # SQL tokenizer for user-simulator prompt
    "fastmcp>=3.2.4",
    "types-psycopg2>=2.9.21.20260408",
    "types-tqdm>=4.67.3.20260408",
    "langchain-openrouter>=0.2.1",
    "pytest>=9.0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conversation2sql"]

[tool.pyrefly]
# https://pyrefly.org/en/docs/configuration/#example-pyprojecttoml
python-interpreter-path = ".venv/bin/python3"
project-includes = ["src", "BIRD-Interact/BIRD-Interact-ADK"]
search-path = ["src", "BIRD-Interact/BIRD-Interact-ADK"]
site-package-path = [".venv/lib/python3.12/site-packages"]
