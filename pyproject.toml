[project]
name = "conversation2sql"
version = "0.1.0"
authors = [
    { name = "Simone Papicchio", email = "simone.papicchio@polito.it" },
]
description = "TODO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "jinja2>=3.1",
    "litellm>=1.0",
    "inspect-ai>=0.3",
    "loguru>=0.7.3",
    "datasets>=4.6.1",
    "hf-transfer>=0.1.9",
    "langchain>=1.2.10",
    "pyyaml>=6.0",
    "pyrefly>=0.55.0",
    "langchain-openai>=1.1.11",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyrefly]
search_paths = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conversation2sql"]
