# eval_pipeline_config.yaml
# Configuration for the conversation2SQL evaluation pipeline.
# Pass this file to EvalPipelineFactory.from_yaml("eval_pipeline_config.yaml").

# ── Reader ────────────────────────────────────────────────────────────────────
# Built-in types:
#   "PlaceholderReader" — returns a canned AIMessage (no API key needed)
#   "BirdInteractReader" - reads from the BirdInteract dataset (requires `gt_path_jsonl` in `dataset_kwargs`)
pipeline:
  debug: true

reader:
  reader_name: "BirdInteractReader"
  dataset_name: 'birdsql/bird-interact-lite' # HF name
  dataset_path: 'data/bird_interact/bird-interact-lite'
  filter_query_category: true

  database_engine: 'postgresql'
  db_dsn_template: 'postgresql://root:123123@localhost:5432/{database}'
  dataset_kwargs:
    gt_path_jsonl: "data/bird_interact/bird-interact-lite/bird_interact_lite_gt_kg_testcases_1008.jsonl"

  # Prompt related fields
  prompt_dir: "prompts/bird_interact_a_agent"
  system_prompt: 'system.jinja'
  user_prompt: 'user.jinja'
  is_chat_template: true

  # Simulator related fields
  user_simulator_prompt_folder: 'prompts/bird_interact_user_simulator'


# ── Predictor ─────────────────────────────────────────────────────────────────
# Calls an LLM and returns the full message list including tool calls.
# Built-in types:
#   "PlaceholderPredictor" — returns a canned AIMessage (no API key needed)
#   "LangChainPredictor" — uses LangChain to call an LLM (requires `model_name` and `model_provider`)
predictor:
  predictor_name: "LangChainPredictor"
  model_name: 'o4-mini'
  model_provider: 'openai'
  tool_names:
    - "execute_sql"
    - "get_schema"
    - "get_all_column_meanings"
    - "get_column_meaning"
    - "get_all_external_knowledge_names"
    - "get_knowledge_definition"
    - "get_all_knowledge_definitions"
    - "ask_user"
    - "submit_sql"
  temperature: 1.0
  top_k: -1
  top_p: 1.0
  max_new_tokens: 2048

  user_patience_budget: 10


# ── Scorer ────────────────────────────────────────────────────────────────────
# Evaluates predictions against gold-standard answers.
# Built-in types:
#   "PlaceholderScorer" — exact string match
scorer:
  scorer_name: "PlaceholderScorer"
  run_score_in_parallel: false
