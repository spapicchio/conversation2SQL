# eval_pipeline_config.yaml
# Configuration for the conversation2SQL evaluation pipeline.
# Pass this file to EvalPipelineFactory.from_yaml("eval_pipeline_config.yaml").

# ── Reader ────────────────────────────────────────────────────────────────────
# Built-in types:
#   "PlaceholderReader" — returns a canned AIMessage (no API key needed)
#   "BirdInteractReader" - reads from the BirdInteract dataset (requires `gt_path_jsonl` in `dataset_kwargs`)
pipeline:
  debug: true
  mode: a-interact  # a-interact | c-interact | oracle 
  output: "results/eval_results.jsonl"
  concurrency: 5  # Number of parallel tasks to run

reader:
  dataset_name_jsonl: 'data/bird_interact/bird-interact-full/bird_interact_data_GT.jsonl'
  dataset_path: 'data/bird_interact/bird-interact-full'
  filter_query_category: true
  # db_dsn_template: 'postgresql://root:123123@localhost:5432/{database}' # Lite DB
  db_dsn_template: 'postgresql://root:123123@localhost:5433/{database}' # Full DB
  user_patience_budget: 10

# ── Predictor ─────────────────────────────────────────────────────────────────
# Calls an LLM and returns the full message list including tool calls.
# Built-in types:
#   "PlaceholderPredictor" — returns a canned AIMessage (no API key needed)
#   "LangChainPredictor" — uses LangChain to call an LLM (requires `model_name` and `model_provider`)
predictor:
  model_name: 'qwen/qwen3.6-flash'  # The model name or path to be used for prediction, e.g., 'gpt-3.5-turbo', 'text-embedding-3-small', etc.
  model_provider: 'openrouter'  # The model provider, e.g., 'openai', 'azure', 'anthropic', etc.
  temperature: 0.0
  top_p: 1
  max_new_tokens: 2000

user_simulator:
  model_name: 'o4-mini'
  model_provider: 'openai'
  temperature: 1.0
  max_new_tokens: 500

